<html>
  <head>
  <style>
    .box{
      width: 50px;
      height: 50px;
      border: 1px solid rgba(42, 43, 51, .78);
      box-shadow: 0 1px 2px rgba(42, 43, 51, .14),
                  0 0 14px rgba(163, 197, 255, .32);
                  border-radius: 10px;
    }
    .s1 {
      width: 300px;
      height: 300px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
    }
    .s2 {
      width: 300px;
      height: 300px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      border: 2px ;
    }
    .d1{
      width: 700px;
      height: 300px;
      display:flex;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;

    }
    html{
      background-color: #f7f3ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei",
                   "Noto Sans SC", sans-serif;
      color: #2a2b33;
      letter-spacing: .02em;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body{
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: transparent;
    }

   
    body::before,
    body::after{
      content: "";
      position: fixed;
      inset: -40%;
      z-index: -1;
      pointer-events: none;
      will-change: transform;
    }
    body::before{
      background:
        radial-gradient(38% 42% at 22% 28%, rgba(255, 174, 190, .80), transparent 72%),
        radial-gradient(34% 40% at 78% 22%, rgba(163, 197, 255, .80), transparent 72%),
        radial-gradient(42% 38% at 72% 78%, rgba(186, 232, 199, .75), transparent 72%),
        radial-gradient(36% 36% at 26% 82%, rgba(255, 224, 178, .80), transparent 72%);
      filter: blur(70px) saturate(115%);
      animation: aurora-a 28s ease-in-out infinite alternate;
    }
    
    body::after{
      background:
        radial-gradient(30% 34% at 62% 34%, rgba(206, 186, 255, .65), transparent 70%),
        radial-gradient(28% 30% at 32% 66%, rgba(255, 210, 235, .65), transparent 70%);
      filter: blur(80px);
      animation: aurora-b 38s ease-in-out infinite alternate;
    }
    @keyframes aurora-a{
      from{ transform: translate3d(-4%, -2%, 0) rotate(0deg)   scale(1.05); }
      to  { transform: translate3d(4%, 3%, 0)   rotate(10deg)  scale(1.15); }
    }
    @keyframes aurora-b{
      from{ transform: translate3d(4%, 3%, 0)   rotate(0deg)   scale(1.10); }
      to  { transform: translate3d(-4%, -3%, 0) rotate(-12deg) scale(1.20); }
    }

    
    .noise{
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      opacity: .35;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    }

    @media (prefers-reduced-motion: reduce){
      body::before, body::after{ animation: none; }
    }
  </style>
  </head>
  <body>
